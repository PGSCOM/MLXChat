name: Build unsigned IPA

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v6
        with:
          path: SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Faro.xcodeproj \
            -clonedSourcePackagesDirPath "$PWD/SourcePackages" \
            -skipPackagePluginValidation

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: DerivedData
          key: ${{ runner.os }}-derived-data-${{ hashFiles('**/*.swift', 'project.yml') }}
          restore-keys: ${{ runner.os }}-derived-data-
          
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Faro.xcodeproj \
            -scheme Faro \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/SourcePackages" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Locate built app
        run: |
          APP_PATH=$(find DerivedData/Build/Products -maxdepth 2 -name 'Faro.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Faro.app not found under DerivedData/Build/Products"
            find DerivedData/Build/Products -maxdepth 2
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Verify MLX Metal shaders were compiled
        run: |
          if [ -z "$(find "$APP_PATH" -name default.metallib 2>/dev/null)" ]; then
            echo "::error::default.metallib missing from Faro.app — MLX GPU ops would crash on device"
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Faro-unsigned.ipa Payload
          ls -lh Faro-unsigned.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: Faro-unsigned-ipa
          path: Faro-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" Faro-unsigned.ipa --clobber

  test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v6
        with:
          path: SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Faro.xcodeproj \
            -scheme Faro \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -clonedSourcePackagesDirPath "$PWD/SourcePackages" \
            -skipPackagePluginValidation \
            -skipMacroValidation
