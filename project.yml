name: Faro

options:
  bundleIdPrefix: app.faro
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.46.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  MCPSwiftSDK:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: 0.11.0
  FlyingFox:
    url: https://github.com/swhitty/FlyingFox
    from: 0.27.1

targets:
  Faro:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Faro
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXVLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      - package: MCPSwiftSDK
        product: MCP
      - package: FlyingFox
        product: FlyingFox
      - package: FlyingFox
        product: FlyingSocks
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Faro
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: >-
          Faro puede anunciar su servidor local para que otros dispositivos de tu
          red lo encuentren.
        NSBonjourServices:
          - _faro._tcp
        NSPhotoLibraryUsageDescription: >-
          Faro necesita acceso a tus fotos para analizarlas con modelos de visión.
        NSMicrophoneUsageDescription: >-
          Faro necesita el micrófono para el modo de conversación por voz.
        NSSpeechRecognitionUsageDescription: >-
          Faro transcribe tu voz en el dispositivo para el modo de conversación.
    entitlements:
      path: Generated/Faro.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.faro.ios
        GENERATE_INFOPLIST_FILE: NO
        # No app icon set is shipped yet — without this, actool fails
        # trying to resolve Xcode's default "AppIcon" name against our
        # Assets.xcassets, which only holds the empty-state illustration.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets:
        - FaroTests

  FaroTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FaroTests
    dependencies:
      - target: Faro
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
